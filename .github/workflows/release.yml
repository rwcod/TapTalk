name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_BASE="${TAG_VERSION%%-*}"
          if [ "$TAG_BASE" != "$PKG_VERSION" ]; then
            echo "Tag $REF_NAME (base $TAG_BASE) does not match package.json version $PKG_VERSION."
            echo "Bump package.json before tagging."
            exit 1
          fi

      - name: Run tests + architecture checks
        run: npm test

      - name: Security audit (prod deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Build .dmg
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List build artifacts
        run: ls -la dist/*.dmg

      - name: Determine prerelease flag
        id: prerelease
        run: |
          case "$REF_NAME" in
            *-preview*|*-rc*|*-beta*|*-alpha*)
              echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TapTalk ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/TapTalk-*.dmg
