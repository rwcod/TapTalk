<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none';" />
    <title>Indicator</title>
    <link rel="stylesheet" href="renderer/styles/indicator.css" />
  </head>
  <body>
    <div id="pill" class="pill" data-phase="recording">

      <!-- Parallax aurora cloud (drifts behind the content, accent-tinted) -->
      <div class="pill-aurora" aria-hidden="true"></div>

      <!-- Unified status dot (every active phase) -->
      <div class="pill-dot-status" aria-hidden="true"></div>

      <!-- Unified waveform (every active phase) -->
      <div class="pill-bars" aria-hidden="true">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <!-- Label -->
      <span id="text" class="pill-text">Recording</span>

      <!-- Timer (right-aligned, every active phase) -->
      <span id="timer" class="pill-timer">0:00</span>

    </div>

    <script src="indicator.js"></script>
  </body>
</html>
